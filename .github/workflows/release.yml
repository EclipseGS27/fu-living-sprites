name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "version=$(jq -r .version module.json)" >> "$GITHUB_OUTPUT"
      - name: Skip if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Zip module
        if: steps.check.outputs.exists == 'false'
        run: zip -r fu-living-sprites.zip . -x '.git/*' '.github/*'
      - uses: softprops/action-gh-release@v2
        if: steps.check.outputs.exists == 'false'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            fu-living-sprites.zip
            module.json
          body: "Install in Foundry with the manifest URL: https://raw.githubusercontent.com/EclipseGS27/fu-living-sprites/main/module.json"
